# Ambiente de produção (VM no Azure). Usado só pelo infra/atualizar.sh, que o pipeline executa a cada push na main:
#   docker compose --env-file /etc/escalas/env -f docker-compose.yml -f docker-compose.prod.yml up -d
# A aplicação usa a imagem publicada no GHCR (IMAGEM no /etc/escalas/env, IMAGEM_TAG = sha-<commit>) e só o proxy (Caddy) fica exposto à internet, em 80/443.
services:
  grafana:
    environment:
      GF_SERVER_ROOT_URL: https://${APP_HOST:?Defina APP_HOST}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Só o admin entra: sem cadastro, sem acesso anônimo, cookies só por HTTPS.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"

  app:
    environment:
      # Produção nunca carrega o cenário de demonstração, a menos que APP_SEED=true esteja no /etc/escalas/env.
      APP_SEED: ${APP_SEED:-false}

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_HOST: ${APP_HOST}
      # IPs que podem abrir o /grafana (ver infra/Caddyfile); sem a variável, só redes privadas (ninguém de fora).
      GRAFANA_IPS: ${GRAFANA_IPS:-private_ranges}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - dados-caddy:/data

volumes:
  dados-caddy:
