name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit já publicado a reimplantar (rollback). Vazio = só roda o pipeline."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  backend:
    name: Backend (testes + cobertura ≥ 75%)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: escalas_coelho_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # jvm.config usa o repositório de certificados do Windows (rede corporativa local); não se aplica ao runner Linux.
      - run: rm -f .mvn/jvm.config
      - name: Testes, cobertura (JaCoCo) e empacotamento
        run: mvn -B verify
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/escalas_coelho_test
      - uses: actions/upload-artifact@v4
        with:
          name: backend-analise
          path: |
            backend/target/classes
            backend/target/site/jacoco/jacoco.xml

  frontend:
    name: Frontend (tipos + testes + cobertura ≥ 25%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-cobertura
          path: frontend/coverage/lcov.info

  analise-estatica:
    name: SonarCloud (qualidade e segurança)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN não configurado — análise SonarCloud ignorada (veja docs/deploy.md)."
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: backend-analise
          path: backend/target
      - uses: actions/download-artifact@v4
        with:
          name: frontend-cobertura
          path: frontend/coverage
      - name: Análise SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  imagem:
    name: Imagem Docker (publicada no GHCR a cada push na main)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  infra:
    name: Infraestrutura (Terraform fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  deploy:
    name: Deploy em produção (Azure)
    needs: [imagem, analise-estatica, infra]
    # Push na main publica o commit; o disparo manual com "commit" preenchido volta para uma versão anterior.
    if: >-
      vars.AZURE_VM != '' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.commit != ''))
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Atualiza a VM (infra/atualizar.sh via run-command, sem SSH)
        env:
          COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          case "$COMMIT" in *[!0-9a-f]*) echo "::error::commit inválido"; exit 1;; esac
          # Atualiza o checkout antes, para executar o atualizar.sh da própria versão publicada.
          script="cd /opt/escalas && git fetch --quiet origin && git checkout --quiet --force $COMMIT && sh infra/atualizar.sh $COMMIT"
          saida=$(az vm run-command invoke \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_VM }}" \
            --command-id RunShellScript --scripts "$script" \
            --query "value[0].message" -o tsv)
          echo "$saida"
          echo "$saida" | grep -q "publicada" || { echo "::error::a atualização da VM falhou"; exit 1; }
      - name: Verifica a aplicação no ar
        run: |
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "${{ vars.APP_URL }}" && { echo "No ar: ${{ vars.APP_URL }}"; exit 0; }
            sleep 10
          done
          echo "::error::a aplicação não respondeu em ${{ vars.APP_URL }}"; exit 1
