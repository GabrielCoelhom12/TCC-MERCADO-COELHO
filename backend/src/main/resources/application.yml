server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: escalas-coelho
  datasource:
    # PostgreSQL em servidor (local, container ou nuvem). Configure pelas variáveis de ambiente.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/escalas_coelho}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      # Fotos (2 MB) e documentos de afastamento (5 MB) são validados no serviço; o limite do servidor fica um pouco
      # acima para devolver a mensagem amigável.
      max-file-size: 6MB
      max-request-size: 6MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Observabilidade: health/info públicos; métricas Prometheus na porta de gerência (não exposta à internet).
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

app:
  jwt:
    # Base64 com >= 32 bytes. Sem valor definido, uma chave aleatória é gerada a cada inicialização
    # (tokens deixam de valer após reiniciar). Em produção, defina APP_JWT_SECRET.
    secret: ${APP_JWT_SECRET:}
    expiracao-horas: 10
  admin:
    # Senha do usuário "gestor" criado no primeiro start. Sem valor definido, uma senha aleatória é gerada e
    # exibida uma única vez no log.
    senha: ${APP_ADMIN_SENHA:}
  otimizacao:
    # Tempo máximo do Timefold para otimizar uma escala (ele para antes se deixar de melhorar).
    segundos: ${APP_OTIMIZACAO_SEGUNDOS:5}
  escala:
    geracao-automatica:
      # Cria sozinho o rascunho das próximas semanas (liga/desliga e antecedência ficam em Parâmetros).
      habilitada: ${APP_GERACAO_AUTOMATICA:true}
      cron: "0 0 6 * * *"
  seed:
    # Popula o banco com o cenário hipotético do Supermercado Coelho na primeira execução.
    habilitado: ${APP_SEED:true}
